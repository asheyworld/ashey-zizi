<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zizi's Galaxy</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #050b20;
    color: white;
    font-family: 'Fredoka', sans-serif;
    overflow: hidden;
}

.page {
    display: none;
    min-height: 100vh;
    width: 100%;
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse at bottom, #142c64 0%, #080f2b 50%, #020611 100%);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 25px;
}

.page.active {
    display: flex;
}

.stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    border-radius: 50%;
    background: #a8eaff;
    box-shadow: 0 0 5px #6bdfff, 0 0 10px #45caff;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: .25; }
    to { opacity: 1; }
}

/* PAGE 1 */

.title {
    font-size: clamp(85px, 22vw, 155px);
    font-weight: 700;
    letter-spacing: 5px;
    color: #bceaff;
    text-shadow: 0 0 15px #56cfff, 0 0 35px #278aff, 0 0 70px #1765d5;
    animation: float 3s ease-in-out infinite;
    z-index: 2;
}

.subtitle {
    color: #b8d9ff;
    letter-spacing: 5px;
    font-size: 12px;
    margin-top: -5px;
    z-index: 2;
}

button {
    font-family: 'Fredoka', sans-serif;
    border: 1px solid #a6ddff;
    color: #e7f8ff;
    background: rgba(88, 164, 255, .18);
    box-shadow: 0 0 15px #348bdb;
    border-radius: 30px;
    padding: 12px 35px;
    font-size: 16px;
    cursor: pointer;
    transition: .3s;
    z-index: 5;
}

button:hover {
    background: #8bd7ff;
    color: #07142e;
    transform: scale(1.08);
}

.play {
    margin-top: 35px;
}

@keyframes float {
    50% { transform: translateY(-12px); }
}

/* PAGE 2 */

.two-stars {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(15px, 7vw, 75px);
    z-index: 2;
    flex-wrap: wrap;
}

.big-star {
    width: clamp(125px, 32vw, 210px);
    aspect-ratio: 1;
    background: linear-gradient(145deg, #c6f3ff, #67b9ff 50%, #2865c7);
    clip-path: polygon(50% 0%, 62% 34%, 98% 35%, 70% 57%, 80% 94%, 50% 72%, 20% 94%, 30% 57%, 2% 35%, 38% 34%);
    filter: drop-shadow(0 0 15px #56caff);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    animation: float 3s infinite ease-in-out;
}

.big-star span {
    font-size: clamp(15px, 4vw, 23px);
    color: #12346b;
    font-weight: 700;
    margin-top: 5px;
}

.big-star:nth-child(2) {
    animation-delay: .5s;
    background: linear-gradient(145deg, #f1dfff, #b38cff 50%, #6448bc);
}

.next {
    margin-top: 65px;
}

/* PAGE 3 */

.letter {
    position: relative;
    width: min(90%, 410px);
    min-height: 440px;
    padding: 55px 28px 35px;
    border-radius: 12px;
    background: linear-gradient(145deg, #e2f5ff, #b8dfff, #d9eaff);
    color: #264b80;
    box-shadow: 0 0 25px #58aaff, 0 0 70px rgba(65, 157, 255, .4);
    z-index: 2;
    transform: rotate(-1deg);
}

.letter h2 {
    font-family: 'Pacifico', cursive;
    text-align: center;
    font-size: 26px;
    margin-bottom: 25px;
    color: #386bb0;
}

.letter p {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 15px;
    line-height: 2;
    text-align: left;
}

.signature {
    text-align: right;
    margin-top: 30px;
    font-family: 'Pacifico', cursive;
    font-size: 19px;
}

.ribbon {
    position: absolute;
    width: 65px;
    height: 65px;
    background: linear-gradient(135deg, #ffb9d9, #e875b6, #ffadd4);
    filter: drop-shadow(2px 4px 4px #7d579c);
    z-index: 4;
}

.ribbon::before,
.ribbon::after {
    content: "";
    position: absolute;
    width: 35px;
    height: 35px;
    border: 9px solid #f58cbe;
    border-radius: 50% 50% 10% 50%;
    top: 8px;
}

.ribbon::before {
    left: -16px;
    transform: rotate(-35deg);
}

.ribbon::after {
    right: -16px;
    transform: rotate(35deg);
}

.ribbon.top {
    top: -25px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
}

.ribbon.bottom {
    bottom: -20px;
    right: 15px;
    transform: rotate(45deg) scale(.7);
}

.edge-star {
    position: absolute;
    color: #70aaff;
    text-shadow: 0 0 8px #479bff;
    font-size: 23px;
}

.s1 { top: 18px; left: 15px; }
.s2 { top: 100px; right: 12px; }
.s3 { bottom: 35px; left: 15px; }
.s4 { bottom: 120px; right: 20px; }

.back {
    margin-top: 35px;
}

@media(max-width: 400px) {
    .letter {
        padding: 48px 22px 30px;
        min-height: 410px;
    }

    .letter p {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<section class="page active" id="page1">
    <div class="stars"></div>
    <div class="title">ZIZI</div>
    <div class="subtitle">A LITTLE WORLD FOR YOU ✦</div>
    <button class="play" onclick="goTo(2)">▶ PLAY</button>
</section>

<!-- PAGE 2 -->
<section class="page" id="page2">
    <div class="stars"></div>

    <div class="two-stars">
        <div class="big-star"><span>ZIZI</span></div>
        <div class="big-star"><span>ASHEY</span></div>
    </div>

    <button class="next" onclick="goTo(3)">NEXT →</button>
</section>

<!-- PAGE 3 -->
<section class="page" id="page3">
    <div class="stars"></div>

    <div class="letter">
        <div class="ribbon top"></div>

        <span class="edge-star s1">✦</span>
        <span class="edge-star s2">✧</span>
        <span class="edge-star s3">✦</span>
        <span class="edge-star s4">✧</span>

        <h2>Dear Zizi ♡</h2>

        <p>
            HEY ZIZI, THIS IS ASHEY.
            <br><br>
            I THINK I'VE LOVED YOU SINCE THE FIRST TIME I SAW YOU.
            <br><br>
            I HOPE THIS LITTLE WORLD MAKES YOU SMILE.
            YOU DESERVE ALL THE LITTLE STARS IN THIS UNIVERSE.
        </p>

        <div class="signature">with love, Ashey ♡</div>
        <div class="ribbon bottom"></div>
    </div>

    <button class="back" onclick="goTo(2)">← BACK</button>
</section>

<script>
function makeStars() {
    document.querySelectorAll('.stars').forEach(container => {
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';

            const size = Math.random() * 2 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';

            container.appendChild(star);
        }
    });
}

function goTo(number) {
    document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
    });

    document.getElementById('page' + number).classList.add('active');
}

makeStars();
</script>

</body>
  </html>
